services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerlite}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlite}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ledgerlite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ledgerlite-pgdata:
