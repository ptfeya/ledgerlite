{% extends "base.html" %}
{% block title %}Accounts · LedgerLite{% endblock %}
{% block content %}
<h1>Accounts</h1>
<div class="cards">
  {% for account in accounts %}
  <section class="card">
    <span class="card-id">Account {{ account.id }}</span>
    <span class="card-name">{{ account.name }}</span>
    <span class="card-balance">{{ account.balance_cents | money }}</span>
    <a href="/ui/history?account_id={{ account.id }}">History</a>
  </section>
  {% endfor %}
</div>
{% endblock %}
