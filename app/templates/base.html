<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Swap error responses (422, 403, ...) too, so form errors are shown inline. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}]}'>
  <title>{% block title %}LedgerLite{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <strong>LedgerLite</strong>
    {% if user %}
    <nav>
      <a href="/ui/accounts">Accounts</a>
      <a href="/ui/transfer">Transfer</a>
      <a href="/ui/history">History</a>
    </nav>
    <form method="post" action="/ui/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span class="muted">{{ user.email }}</span>
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
