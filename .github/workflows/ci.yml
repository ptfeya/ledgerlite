name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlite
          POSTGRES_PASSWORD: ledgerlite
          POSTGRES_DB: ledgerlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlite -d ledgerlite"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://ledgerlite:ledgerlite@localhost:5432/ledgerlite
      JWT_SECRET: ci-only-secret-not-for-production
      PAYMENTS_GATEWAY_API_KEY: ci-only-gateway-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
