name: QA

# Informational check: it posts a report and does not gate merge unless added to branch protection.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  qa:
    # Fork PRs and Dependabot PRs get no Actions secrets, so the keyed agent cannot run for them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerlite
          POSTGRES_PASSWORD: ledgerlite
          POSTGRES_DB: ledgerlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerlite -d ledgerlite"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: true
      DATABASE_URL: postgresql://ledgerlite:ledgerlite@localhost:5432/ledgerlite
      JWT_SECRET: ci-only-secret-not-for-production
      SEED_PASSWORD: ci-only-seed-password
    steps:
      # The code under test: the PR head (or the dispatched ref).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The instructions the agent follows: always from the base branch, so a PR
      # cannot rewrite the skills that run with FACTORY_API_KEY.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # System Python lives outside the runner's home, so the separate QA app user can run it.
      # --no-build refuses source distributions, so no PR-controlled build script runs as the
      # runner user (which also runs the keyed agent). The project is not installed, and dev
      # dependencies are not needed to serve the app. The venv is only ever executed as qa-app.
      - name: Install dependencies
        run: uv sync --locked --no-dev --no-build --python /usr/bin/python3.12
      # Stale output committed in a PR must never be published as this run's result.
      - name: Reset QA output
        run: rm -rf qa-results qa-output.txt
      - name: Use base-branch QA instructions
        id: skills
        run: |
          if [ -f base/.factory/skills/qa/SKILL.md ]; then
            # Everything droid exec loads as instructions or config, at any depth, in any
            # letter case: .factory/, .agents/ and .agent/ directories, and AGENTS.md,
            # CLAUDE.md and DESIGN.md files (nested ones such as app/AGENTS.md also apply).
            INSTR=( \( \( -type d \( -iname .factory -o -iname .agents -o -iname .agent \) \)
              -o \( -type f \( -iname agents.md -o -iname claude.md -o -iname design.md \) \) \) )
            find . \( -path ./base -o -path ./.git -o -path ./.venv \) -prune -o \
              "${INSTR[@]}" -print0 | xargs -0 -r rm -rf
            (cd base && find . -path ./.git -prune -o "${INSTR[@]}" -print0 \
              | xargs -0 -r cp -R --parents -t ..)
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            mkdir -p qa-results
            printf '## QA Report\n\n:grey_question: INCONCLUSIVE: the QA skills do not exist on the base branch yet, so QA did not run. It will run once they are merged.\n' > qa-results/report.md
          fi
      - name: Read QA config
        id: cfg
        if: steps.skills.outputs.present == 'true'
        run: |
          C=.factory/skills/qa/config.yaml
          VE=$(yq '.video_evidence' $C)
          CP=$(yq '.droid_control.compose' $C)
          [ "$VE" = "true" ] || CP=false
          echo "video=$VE" >> "$GITHUB_OUTPUT"
          echo "compose=$CP" >> "$GITHUB_OUTPUT"
          echo "imagemagick=$(yq '.imagemagick' $C)" >> "$GITHUB_OUTPUT"
      - name: Install system tools
        if: steps.skills.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          PKGS=""
          [ "${{ steps.cfg.outputs.imagemagick }}" = "true" ] && PKGS="$PKGS imagemagick"
          { [ "${{ steps.cfg.outputs.video }}" = "true" ] || [ "${{ steps.cfg.outputs.compose }}" = "true" ]; } && PKGS="$PKGS ffmpeg"
          [ -n "$PKGS" ] && sudo apt-get install -y -qq $PKGS || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.skills.outputs.present == 'true'
        with:
          node-version: 22
      # Tradeoff: this pipes an unpinned, unchecksummed installer into sh. Factory
      # publishes no versioned checksum for it, so we accept that risk. The step has
      # no secrets in its environment, which limits the blast radius.
      - name: Install droid CLI
        if: steps.skills.outputs.present == 'true'
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pinned browser tooling, installed in this trusted step (no secrets in its environment):
      # agent-browser 0.43.0 from a lockfile with integrity hashes (npm ci --ignore-scripts),
      # a sha256-checked Chrome for Testing build, and droid-control at a fixed commit. All pins
      # live in qa-tools.sh, tools/package.json and .factory/settings.json. The script also exports
      # the PATH and browser location for later steps. A failed install does not fail the job; the preflight reports it as
      # BLOCKED. This script comes from the base branch (the instruction copy above).
      # Until the tooling script exists on the base branch (as with the first PR that adds it),
      # skip the install; the preflight step then reports web QA as BLOCKED.
      - name: Install QA browser tooling
        id: tools
        if: steps.skills.outputs.present == 'true'
        run: |
          T=.factory/skills/qa/scripts/qa-tools.sh
          if [ ! -f "base/$T" ] || [ ! -f "$T" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::QA browser tooling is not on the base branch yet; skipping install"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          # Ubuntu 24.04 blocks unprivileged user namespaces, which Chrome's sandbox needs.
          # Re-enable them instead of running Chrome with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          "$T" install
      # The PR's application code runs here, as a different OS user with a scrubbed
      # environment, in a step that has no secrets. It starts before (and outlives) the
      # step that holds FACTORY_API_KEY. QA uses a dummy gateway key.
      # The app user cannot read the agent's process environment, so the agent
      # credential stays out of PR-controlled code. The runner
      # user never executes the PR's venv or app; qa-server.sh start only runs psql itself.
      - name: Start QA application server
        if: steps.skills.outputs.present == 'true'
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin qa-app
          # Open only what the app needs. .git, base/ and the rest of the workspace stay private.
          sudo chmod o+x "$HOME"
          chmod a+rx .
          chmod -R a+rX app db .venv
          chmod -R go-rwx .git base
          # The trusted base launcher may not forward the new gateway setting.
          # Seed and Uvicorn can both read this dummy through the app's dotenv loader.
          (
            qa_dotenv=$(mktemp .qa-dotenv.XXXXXXXX)
            trap 'rm -f -- "$qa_dotenv"' EXIT
            printf '%s\n' 'PAYMENTS_GATEWAY_API_KEY=qa-only-gateway-key' > "$qa_dotenv"
            chmod 0644 "$qa_dotenv"
            # Link atomically and fail if .env already exists, including a symlink.
            ln -T -- "$qa_dotenv" .env
          )
          S=.factory/skills/qa/scripts/qa-server.sh
          QA_RUN_AS=qa-app setsid nohup "$S" start > "$RUNNER_TEMP/qa-server.log" 2>&1 < /dev/null &
          for _ in $(seq 60); do
            "$S" verify 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/qa-server.log"
          exit 1
      # Proves the browser stack works against the live QA server before the agent starts.
      # It never fails the job: a problem is written to qa-results/preflight.txt as
      # "QA_PREFLIGHT: BLOCKED" with reasons, which the agent must report (qa skill, Step 4).
      - name: QA browser preflight
        if: steps.skills.outputs.present == 'true'
        env:
          QA_NEED_FFMPEG: ${{ steps.cfg.outputs.video == 'true' || steps.cfg.outputs.compose == 'true' }}
          QA_NEED_IMAGEMAGICK: ${{ steps.cfg.outputs.imagemagick }}
        run: |
          if [ "${{ steps.tools.outputs.present }}" = "true" ]; then
            .factory/skills/qa/scripts/qa-tools.sh preflight
          else
            mkdir -p qa-results
            printf 'QA_PREFLIGHT: BLOCKED\nScope: all web (browser) flows. API flows (curl) are not affected.\nBLOCKED tooling: tooling not yet on base branch\n' > qa-results/preflight.txt
            cat qa-results/preflight.txt
          fi
      - name: Run QA
        if: steps.skills.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 18
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          QA_EVIDENCE_TOKEN: ${{ steps.cfg.outputs.video == 'true' && secrets.QA_EVIDENCE_TOKEN || '' }}
          REPO_ID: ${{ github.event.repository.id }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          VIDEO: ${{ steps.cfg.outputs.video }}
          COMPOSE: ${{ steps.cfg.outputs.compose }}
        run: |
          mkdir -p qa-results
          EXTRA=""
          [ "$VIDEO" = "true" ] && EXTRA="$EXTRA Use droid-control Capture and upload video evidence per the qa skill's Evidence Capture rules."
          [ "$COMPOSE" = "true" ] && EXTRA="$EXTRA Run droid-control Compose for each captured flow before upload."
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill. The diff base is $DIFF_BASE. Read qa-results/preflight.txt first: if it says QA_PREFLIGHT: BLOCKED, report every web flow BLOCKED with its reasons (qa skill Step 4) and still run API flows. A QA application server is already running. Check it only with env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/nonexistent .factory/skills/qa/scripts/qa-server.sh verify (and url); never start another server. Never execute anything from this checkout (python, .venv, uv, app code, scripts); read files and talk to the server over HTTP only. Write the final report to qa-results/report.md.$EXTRA" 2>&1 | tee qa-output.txt
      - name: Stop QA application server
        if: always()
        run: sudo pkill -u qa-app || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa-results
          path: |
            qa-results/
            qa-output.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Post QA report as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body;
            if (fs.existsSync('qa-results/report.md')) {
              body = fs.readFileSync('qa-results/report.md', 'utf8');
              if (!body.trimStart().startsWith('## QA Report')) body = '## QA Report\n\n' + body;
            } else {
              const out = fs.existsSync('qa-output.txt') ? fs.readFileSync('qa-output.txt', 'utf8').slice(-20000) : 'no output';
              body = '## QA Report\n\n:no_entry: QA produced no report.\n\n<details><summary>Output</summary>\n\n```\n' + out + '\n```\n\n</details>';
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body = `<!-- qa-report -->\n${body}\n\n---\n[Workflow run and downloadable artifacts](${run})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith('<!-- qa-report -->'));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
